##
# TECHNOLOGY DEFINITIONS
##

# --8<-- [start:--8<-- [end:Note: ']' and ']' is used in tutorial documentation only

templates:
# --8<-- [start:transmission-templates]
  power_lines:
    name: "Electrical power distribution"
    color: "#6783E3"
    base_tech: transmission
    carrier_in: electricity
    carrier_out: electricity
    flow_cap_max: 2000
    flow_out_eff: 0.98
    lifetime: 25
    cost_flow_cap_per_distance:
      data: 0.01
      index: monetary
      dims: costs

# --8<-- [end:transmission-templates]
techs:
  ##-GRID SUPPLY-##
  # --8<-- [start:supply]
  supply_grid_power:
    name: "National grid import"
    color: "#C5ABE3"
    base_tech: supply
    carrier_out: electricity
    source_use_max: .inf
    flow_cap_max: 2000
    lifetime: 25
    cost_flow_cap:
      data: 15
      index: monetary
      dims: costs
    cost_source_use:
      data: 0.1 # 10p/kWh electricity price #ppt
      index: monetary
      dims: costs

  # --8<-- [end:supply]

  ##-Renewables-##
  # --8<-- [start:pv]
  pv:
    name: "Solar photovoltaic power"
    color: "#F9D956"
    base_tech: supply
    carrier_out: electricity
    carrier_export: electricity
    source_unit: per_area
    area_use_per_flow_cap: 7 # 7m2 of panels needed to fit 1kWp of panels
    flow_out_parasitic_eff: 0.85 # inverter losses
    flow_cap_max: 250
    area_use_max: 1500
    lifetime: 25
    cost_flow_cap:
      data: 500
      index: monetary
      dims: costs

  # --8<-- [end:pv]

  # Conversion

  ##-DEMAND-##
  # --8<-- [start:demand]
  demand_electricity:
    name: "Electrical demand"
    color: "#072486"
    base_tech: demand
    carrier_in: electricity

  # --8<-- [end:demand]

  ##-DISTRIBUTION-##
  # --8<-- [start:transmission]

  X1_to_X2:
    link_from: X1
    link_to: X2
    template: power_lines
    distance: 10
  X1_to_X3:
    link_from: X1
    link_to: X3
    template: power_lines
    distance: 5

# --8<-- [end:transmission]
