# --8<-- [start:config]
config:
  init:
    name: Urban-scale example model
    # What version of Calliope this model is intended for
    calliope_version: 0.7.0
    subset:
      timesteps: ["2024-04-01", "2024-04-02"] # Subset of timesteps
    broadcast_input_data: true  # allow single indexed parameter data entries to be broadcast across all index items, if there are multiple entries.
    mode: base # Choices: base, operate, spores

  build:
    ensure_feasibility: true # Switching on unmet demand
    operate:
          window: 12h
          horizon: 24h

  solve:
    solver: gurobi
# --8<-- [end:config]

# --8<-- [start:parameter_data_definitions]
data_definitions:
  objective_cost_weights:
    data: 1
    index: monetary
    dims: costs
  # `bigM` sets the scale of unmet demand, which cannot be too high, otherwise the optimisation will not converge
  bigM: 1e6
  cost_interest_rate:
    data: 0.10
    index: monetary
    dims: costs
# --8<-- [end:parameter_data_definitions]

techs:
  ##-GRID SUPPLY-##
  # --8<-- [start:supply]
  supply_grid_power:
    name: "National grid import"
    color: "#C5ABE3"
    base_tech: supply
    carrier_out: electricity
    source_use_max: .inf
    flow_cap_max: 50000
    lifetime: 25
    flow_cap: 28000
    cost_flow_cap:
      data: 1
      index: monetary
      dims: costs
#    cost_source_use:
#      data: 0.1 # 10p/kWh electricity price #ppt
#      index: monetary
#      dims: costs

  # --8<-- [end:supply]

  ##-Renewables-##
  # --8<-- [start:pv]
  pv:
    name: "Solar photovoltaic power"
    color: "#F9D956"
    base_tech: supply
    carrier_out: electricity
    carrier_export: electricity
    source_unit: per_cap
    flow_out_parasitic_eff: 0.85 # inverter losses
    flow_cap_max: 1000
    flow_cap: 0
    lifetime: 25
    cost_flow_cap:
      data: 0.01
      index: monetary
      dims: costs

  wind:
    name: "Wind power"
    color: "#A7568D"
    base_tech: supply
    carrier_out: electricity
    carrier_export: electricity
    source_unit: per_cap
    flow_out_parasitic_eff: 0.95 # power electronics losses
    flow_cap_max: 20000
    lifetime: 25
    cost_flow_cap:
      data: 1
      index: monetary
      dims: costs

  battery:
    name: "Battery storage"
    color: "#3B61E3"
    base_tech: storage
    carrier_in: electricity
    carrier_out: electricity
    flow_cap_max: 50000 # kW
    flow_cap: 15000
    storage_cap_max: 10000000 # kWh
    storage_cap: 500000
    # 0.95 * 0.95 = 0.9025 round trip efficiency
    flow_out_eff: 0.95
    flow_in_eff: 0.95
    storage_loss: 0 # No loss over time assumed
    lifetime: 25
    cyclic_storage: false
    cost_flow_cap:
      data: 0.1
      index: monetary
      dims: costs

  # --8<-- [end:pv]

  # Conversion

  ##-DEMAND-##
  # --8<-- [start:demand]
  demand_electricity:
    name: "Electrical demand"
    color: "#072486"
    base_tech: demand
    carrier_in: electricity

  # --8<-- [end:demand]


nodes:
  HV_station:
    techs:
      supply_grid_power:
  residential_demand:
    techs:
      demand_electricity:
  data_center_1:
    techs:
      demand_electricity:
      pv:
      battery:
  data_center_2:
    techs:
      demand_electricity:
      pv:
      battery:
  data_center_3:
    techs:
      demand_electricity:
      pv:
      battery:
  transmission_1:
    techs:
  transmission_2:
    techs:
  transmission_3:
    techs:
  transmission_4:
    techs:
  transmission_5:
    techs:
  transmission_6:
    techs:
  transmission_7:
    techs:


# --8<-- [start:data-tables]
data_tables:
  demand:
    data: demand.csv
    rows: [timesteps]
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
  day_ahead_prices:
    data: day_ahead_prices.csv
    rows: [timesteps]
    columns: [comment,techs]
    add_dims:
      parameters: cost_flow_out
      costs: monetary
    drop: comment
  pv_resource:
    data: pv_resource.csv
    rows: [timesteps]
    columns: [comment, scaler]
    add_dims:
      parameters: source_use_equals
      techs: pv
    drop: [comment, scaler]
  wind_resource:
    data: wind_resource.csv
    rows: [timesteps]
    columns: [comment, scaler]
    add_dims:
      parameters: source_use_equals
      techs: wind
    drop: [comment, scaler]
  links_costs:
    data: links_costs.csv
    rows: techs
    columns: parameters
    add_dims:
      costs: monetary
  links_carriers:
    data: links_carriers.csv
    rows: techs
    columns: parameters
    add_dims:
      carriers: electricity
  links:
    data: links_techs.csv
    rows: techs
    columns: parameters
  nodes_coordinates:
    data: nodes_coordinates.csv
    rows: nodes
    columns: parameters
# --8<-- [end:data-tables]
