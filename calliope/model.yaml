# --8<-- [start:config]
config:
  init:
    name: Amsterdam data center model
    # What version of Calliope this model is intended for
    calliope_version: 0.7.0
    broadcast_input_data: true  # allow single indexed parameter data entries to be broadcast across all index items, if there are multiple entries.
    mode: base # Choices: base, operate, spores

  build:
    ensure_feasibility: true # Switching on unmet demand

  solve:
    solver: gurobi
# --8<-- [end:config]

# --8<-- [start:parameter_data_definitions]
data_definitions:
  objective_cost_weights:
    data: 1
    index: monetary
    dims: costs
  cost_interest_rate:
    data: 1
    index: monetary
    dims: costs
  # `bigM` sets the scale of unmet demand, which cannot be too high, otherwise the optimisation will not converge
  bigM: 1
# --8<-- [end:parameter_data_definitions]

techs:
  grid_supply:
    name: "National grid import"
    color: "#C5ABE3"
    base_tech: supply
    carrier_out: electricity
    cost_flow_cap:
        data: 1000
        index: monetary
        dims: costs
    flow_cap_max: 2000
    lifetime: 20

  demand:
    name: "Electrical demand"
    color: "#072486"
    base_tech: demand
    carrier_in: electricity

  pv:
    name: "Solar photovoltaic array"
    color: "#F9D956"
    base_tech: supply
    carrier_out: electricity
    flow_out_parasitic_eff: 0.85 # inverter losses
    flow_cap_max: 250
    lifetime: 25
    cost_flow_cap:
      data: 1350
      index: monetary
      dims: costs

  wind_onshore:
    name: "Onshore wind turbine"
    color: "#F9G543"
    base_tech: supply
    carrier_out: electricity
    flow_out_parasitic_eff: 0.95 # inverter losses
    flow_cap_max: 250
    lifetime: 25
    cost_flow_cap:
      data: 1350
      index: monetary
      dims: costs

  battery:
    name: "Battery storage"
    color: "#3B61E3"
    base_tech: storage
    carrier_in: electricity
    carrier_out: electricity
    flow_cap_max: 1000 # kW
    storage_cap_max: .inf
    flow_cap_per_storage_cap_max: 4
    flow_out_eff: 0.95
    flow_in_eff: 0.95
    storage_loss: 0 # No loss over time assumed
    lifetime: 25

# --8<-- [start:data-tables]

data_tables:
  links_costs_monetary:
    data: data_tables/links_costs.csv
    rows: techs
    columns: parameters
    add_dims:
      costs: monetary
  links_electricity:
    data: data_tables/links_electricity.csv
    rows: techs
    columns: parameters
    add_dims:
      carriers: electricity
  links_heat:
    data: data_tables/links_heat.csv
    rows: techs
    columns: parameters
    add_dims:
      carriers: heat
  links:
    data: data_tables/links.csv
    rows: techs
    columns: parameters
  nodes:
    data: data_tables/nodes.csv
    rows: [nodes,techs,parameters]
    columns: timesteps
  nodes_base_info:
    data: data_tables/nodes_base_info.csv
    rows: nodes
    columns: parameters
